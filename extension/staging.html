<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>PrairieRun Staging</title><link rel="stylesheet" href="staging.css" /></head>
  <body>
    <header class="topbar"><div><p class="eyebrow">PrairieRun</p><h1>Assignment staging area</h1><p class="muted">Showing assignments due today or later. Older assignments remain in Google Calendar.</p><div class="settings"><label class="auto-setting"><input id="show-undated-setting" type="checkbox" /> Show undated assignments</label></div></div><div class="top-actions"><button id="sync-action" class="primary" disabled>Needs sync</button></div></header>
