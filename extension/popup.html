<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>PrairieRun</title><link rel="stylesheet" href="popup.css" /></head>
  <body>
    <main>
      <p class="eyebrow">PrairieRun</p>
      <h1>Assignment calendar</h1>
      <p id="context" class="muted">Checking the active PrairieLearn page…</p>
      <div class="settings-card">
        <label><input id="show-undated" type="checkbox" /> Show undated assignments</label>
        <label><input id="auto-add" type="checkbox" /> Automatically sync new assignments</label>
      </div>
      <button id="scan" class="primary">Scan all classes</button>
      <button id="reset-data" class="secondary">Clear test data</button>
      <p class="muted small">Assignments appear directly below your PrairieLearn course links.</p>
    </main>
    <script src="view-utils.js"></script><script src="popup.js"></script>
  </body>
</html>
