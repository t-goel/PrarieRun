<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>PrairieRun</title><link rel="stylesheet" href="popup.css" /></head>
  <body>
    <main>
      <p class="eyebrow">PrairieRun</p>
      <h1>Assignment calendar</h1>
      <p id="context" class="muted">Checking the active PrairieLearn page…</p>
      <div class="settings-card">
        <label for="completion-threshold">Complete at <input id="completion-threshold" type="number" min="0" max="100" step="1" value="95" />% or higher</label>
        <label for="notification-lead-hours">Notify me <input id="notification-lead-hours" type="number" min="0" max="168" step="0.25" value="4" /> hours before due</label>
        <label for="timezone">Timezone <select id="timezone"><option value="CST">Central (CST/CDT)</option><option value="EST">Eastern (EST/EDT)</option><option value="MST">Mountain (MST/MDT)</option><option value="PST">Pacific (PST/PDT)</option></select></label>
      </div>
      <button id="scan" class="primary">Scan all classes</button>
      <button id="reset-data" class="secondary">Clear test data</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
